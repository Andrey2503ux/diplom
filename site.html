<script>
// Создание плавающих сердечек
function createHearts() {
    const heartsContainer = document.getElementById('hearts');
    for (let i = 0; i < 50; i++) {
        const heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '💖';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDelay = Math.random() * 6 + 's';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heartsContainer.appendChild(heart);
    }
}

// Создание блесток
function createSparkles() {
    setInterval(() => {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = Math.random() * 100 + 'vw';
        sparkle.style.top = Math.random() * 100 + 'vh';
        document.body.appendChild(sparkle);
        
        setTimeout(() => {
            sparkle.remove();
        }, 1500);
    }, 100);
}

// Список комплиментов для Вари
const compliments = [
    "Твоя улыбка освещает весь мир 🌟",
    "Ты невероятно прекрасна каждый день 💫",
    "Твои глаза - самые красивые во Вселенной ✨",
    "Ты умнее всех и прекраснее всех одновременно 💖",
    "Твоя душа такая же красивая, как и внешность 🌸",
    "Ты делаешь этот мир лучше просто своим существованием 🌈",
    "Твоя энергия заряжает позитивом всех вокруг ⚡",
    "Ты самая желанная и любимая 💕",
    "Твоё сердце полно доброты и тепла 🔥",
    "Ты вдохновляешь на великие дела 🎯",
    "Твоя красота не поддается описанию 📝",
    "Ты - воплощение совершенства 💎",
    "С тобой хочется прожить вечность ⏳",
    "Твои мечты обязательно сбудутся 🌠",
    "Ты заслуживаешь всего самого лучшего 🏆",
    "Твоя нежность растапливает самые холодные сердца ❄️",
    "Ты - самая яркая звезда на небе 🌟",
    "Твоё присутствие делает любой день особенным 🎉",
    "Ты уникальна и неповторима 🦄",
    "Твоя красота с каждым днем только расцветает 🌷"
];

// Добавление комплиментов на страницу
function displayCompliments() {
    const container = document.getElementById('compliments');
    compliments.forEach((compliment, index) => {
        const card = document.createElement('div');
        card.className = 'compliment-card';
        card.textContent = compliment;
        card.style.animationDelay = (index * 0.1) + 's';
        container.appendChild(card);
    });
}

// Инициализация всех эффектов
function init() {
    createHearts();
    createSparkles();
    displayCompliments();
}

// Запуск при загрузке страницы
document.addEventListener('DOMContentLoaded', init);

// Добавление эффекта параллакса при движении
document.addEventListener('mousemove', (e) => {
    const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
    const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
    document.querySelector('.header').style.transform = `translate(${moveX}px, ${moveY}px)`;
});
</script>
